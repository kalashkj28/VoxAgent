version: "3.8"

services:
  voxagent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # SQLite data persist karega restart ke baad bhi
      - ./data:/app/data
      # PDFs for RAG
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
