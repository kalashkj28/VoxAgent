<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxAgent - Voice AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 500px; background: #1a1a2e; border-radius: 20px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        h1 { text-align: center; font-size: 28px; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
        .status { text-align: center; padding: 8px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .status.connected { background: #0a3d2a; color: #4ade80; }
        .status.disconnected { background: #3d0a0a; color: #f87171; }
        .status.recording { background: #3d2a0a; color: #fbbf24; }
        #chat-box { height: 320px; overflow-y: auto; border: 1px solid #2a2a4a; border-radius: 12px; padding: 14px; margin-bottom: 16px; background: #0a0a18; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .message.user { background: #1e40af; margin-left: auto; text-align: right; border-bottom-right-radius: 4px; }
        .message.bot { background: #1f2937; border-bottom-left-radius: 4px; }
        .message.system { background: transparent; color: #666; text-align: center; font-size: 12px; max-width: 100%; }
        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 12px 18px; background: #1f2937; border-radius: 12px; border-bottom-left-radius: 4px; width: fit-content; margin-bottom: 12px; }
        .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: #666; animation: bounce 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }
        .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 16px; }
        #mic-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #3b82f6; background: transparent; color: white; font-size: 28px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        #mic-btn:hover { background: #1e3a5f; }
        #mic-btn.recording { border-color: #ef4444; background: #450a0a; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } }
        .input-area { display: flex; gap: 8px; margin-bottom: 16px; }
        #text-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2a2a4a; background: #0a0a18; color: #eee; font-size: 14px; outline: none; }
        #text-input:focus { border-color: #3b82f6; }
        #send-btn { padding: 12px 18px; border-radius: 10px; border: none; background: #3b82f6; color: white; cursor: pointer; font-size: 14px; font-weight: 600; }
        #send-btn:hover { background: #2563eb; }
        .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
        .metric { background: #0a0a18; border-radius: 8px; padding: 10px 6px; border: 1px solid #1a1a3a; }
        .metric-label { font-size: 10px; color: #666; text-transform: uppercase; }
        .metric-value { font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ VoxAgent</h1>
        <p class="subtitle">Real-time Voice AI Agent</p>
        
        <div id="status" class="status disconnected">🔴 Disconnected</div>
        
        <div id="chat-box">
            <div class="message system">🎤 Mic button click to start</div>
        </div>

        <div class="controls">
            <button id="mic-btn" onclick="toggleRecording()">🎤</button>
            <button id="auto-btn" onclick="toggleAutoMode()" style="padding: 10px 16px; border-radius: 20px; border: 2px solid #666; background: transparent; color: #888; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s;">🔁 Auto: OFF</button>
            <button id="tts-btn" onclick="toggleTTS()" style="padding: 10px 16px; border-radius: 20px; border: 2px solid #4ade80; background: rgba(74,222,128,0.1); color: #4ade80; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s;">🔊 Voice: ON</button>
        </div>

        <div class="input-area">
            <input type="text" id="text-input" placeholder="Or type here..." />
            <button id="send-btn" onclick="sendText()">Send</button>
        </div>

        <div class="metrics">
            <div class="metric"><div class="metric-label">STT</div><div class="metric-value" id="stt-ms">-</div></div>
            <div class="metric"><div class="metric-label">LLM</div><div class="metric-value" id="llm-ms">-</div></div>
            <div class="metric"><div class="metric-label">TTS</div><div class="metric-value" id="tts-ms">-</div></div>
            <div class="metric"><div class="metric-label">Total</div><div class="metric-value" id="total-ms">-</div></div>
        </div>

        <div style="margin-top: 16px; padding: 14px; border: 1px solid #2a2a4a; border-radius: 12px; background: #0a0a18;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-size: 13px; font-weight: 600; color: #888;">📚 Knowledge Base</span>
                <span id="kb-status" style="font-size: 11px; color: #666;">No documents</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="file" id="pdf-input" accept=".pdf" style="display: none;" onchange="uploadPDF()" />
                <button id="upload-btn" onclick="document.getElementById('pdf-input').click()" style="flex: 1; padding: 10px; border-radius: 10px; border: 1px dashed #3b82f6; background: transparent; color: #3b82f6; cursor: pointer; font-size: 12px; transition: all 0.3s;">📄 Upload PDF</button>
            </div>
            
            <div id="kb-progress" style="display: none; margin-top: 8px;">
                <div style="background: #1a1a3a; border-radius: 6px; overflow: hidden; height: 6px;">
                    <div id="kb-progress-bar" style="height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 6px; width: 0%; transition: width 0.3s ease;"></div>
                </div>
                <div id="kb-progress-text" style="font-size: 11px; color: #888; margin-top: 4px; text-align: center;">Uploading...</div>
            </div>
            <div id="kb-files" style="margin-top: 8px;"></div>
        </div>
    </div>

    <script>
    let ttsEnabled = true;

    function toggleTTS() {
        ttsEnabled = !ttsEnabled;
        const btn = document.getElementById("tts-btn");
        if (ttsEnabled) {
            btn.textContent = "🔊 Voice: ON";
            btn.style.borderColor = "#4ade80";
            btn.style.color = "#4ade80";
            btn.style.background = "rgba(74,222,128,0.1)";
        } else {
            btn.textContent = "🔇 Voice: OFF";
            btn.style.borderColor = "#666";
            btn.style.color = "#888";
            btn.style.background = "transparent";
        }
        
        // Tell server to skip TTS
        if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
            voiceWs.send(ttsEnabled ? "tts_on" : "tts_off");
        }
        if (chatWs && chatWs.readyState === WebSocket.OPEN) {
            chatWs.send(ttsEnabled ? "tts_on" : "tts_off");
        }
        addMessage(`${ttsEnabled ? "🔊" : "🔇"} Voice ${ttsEnabled ? "ON" : "OFF"}`, "system");
    }

    const voiceWs = new WebSocket("ws://localhost:8000/ws/voice");
    const chatWs = new WebSocket("ws://localhost:8000/ws/chat");
    
    const statusDiv = document.getElementById("status");
    const chatBox = document.getElementById("chat-box");

    voiceWs.onopen = () => {
        statusDiv.textContent = "🟢 Connected — Ready to talk!";
        statusDiv.className = "status connected";
    };

    voiceWs.onmessage = (event) => {
        if (event.data instanceof Blob) {
            playAudio(event.data);
            return;
        }
        
        const data = JSON.parse(event.data);
        
        if (data.type === "transcript") {
            addMessage(`🎤 ${data.text}`, "user");
            showTyping();
        }
        else if (data.type === "response") {
            removeTyping();
            addMessageStreaming(data.text, "bot");
        }
        else if (data.type === "metrics") {
            document.getElementById("stt-ms").textContent = data.stt_ms + "ms";
            document.getElementById("llm-ms").textContent = data.llm_ms + "ms";
            document.getElementById("tts-ms").textContent = data.tts_ms + "ms";
            document.getElementById("total-ms").textContent = data.total_ms + "ms";
        }
        else if (data.type === "error") {
            addMessage(`⚠️ ${data.message}`, "system");
        }
        else if (data.type === "no_wake_word") {
            if (autoMode) {
                setTimeout(() => { if (autoMode) startRecording(); }, 100);
            }
        }
    };

    voiceWs.onclose = () => {
        statusDiv.textContent = "🔴 Disconnected";
        statusDiv.className = "status disconnected";
    };

    chatWs.onmessage = (event) => {
        if (event.data instanceof Blob) {
            playAudio(event.data);
            return;
        }
        
        const data = JSON.parse(event.data);
        if (data.type === "response") {
            removeTyping();
            addMessageStreaming(data.text, "bot");
        } else if (data.type === "metrics") {
            document.getElementById("stt-ms").textContent = data.stt_ms + "ms";
            document.getElementById("llm-ms").textContent = data.llm_ms + "ms";
            document.getElementById("tts-ms").textContent = data.tts_ms + "ms";
            document.getElementById("total-ms").textContent = data.total_ms + "ms";
        } else if (data.type === "error") {
            addMessage(`⚠️ ${data.message}`, "system");
        }
    };

    chatWs.onerror = (error) => {
        console.error("Chat WebSocket error:", error);
    };

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentAudio = null;
    let autoMode = false;
    let silenceTimer = null;
    let audioContext = null;
    let analyser = null;
    let micStream = null;

    function toggleAutoMode() {
        autoMode = !autoMode;
        const btn = document.getElementById("auto-btn");
        if (autoMode) {
            btn.textContent = "🔁 Auto: ON";
            btn.style.borderColor = "#4ade80";
            btn.style.color = "#4ade80";
            btn.style.background = "#0a3d2a";
            addMessage('🔁 Auto mode ON', "system");
            if (voiceWs.readyState === WebSocket.OPEN) {
                voiceWs.send(JSON.stringify({ type: "auto_on" }));
            }
            startRecording();
        } else {
            btn.textContent = "🔁 Auto: OFF";
            btn.style.borderColor = "#666";
            btn.style.color = "#888";
            btn.style.background = "transparent";
            addMessage("🔁 Auto mode OFF", "system");
            if (voiceWs.readyState === WebSocket.OPEN) {
                voiceWs.send(JSON.stringify({ type: "auto_off" }));
            }
            if (isRecording) stopRecording();
        }
    }

    function interruptCurrentResponse() {
        try {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
                voiceWs.send(JSON.stringify({ type: "cancel" }));
            }
        } catch (err) {}
    }

    async function toggleRecording() {
        if (isRecording) {
            stopRecording();
        } else {
            await startRecording();
        }
    }

    async function startRecording() {
        try {
            interruptCurrentResponse();
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            micStream = stream;
            
            mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 128000 });
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
                
                if (audioBlob.size > 1000) {
                    addMessage("🔄 Processing...", "system");
                    voiceWs.send(await audioBlob.arrayBuffer());
                } else if (autoMode) {
                    setTimeout(() => { if (autoMode) startRecording(); }, 500);
                }
                
                if (!autoMode) {
                    stream.getTracks().forEach(track => track.stop());
                }
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById("mic-btn").classList.add("recording");
            document.getElementById("mic-btn").textContent = "⬜";
            statusDiv.textContent = autoMode ? "🟢 Auto Mode Active" : "🔴 Recording... Click to stop";
            statusDiv.className = "status recording";
            
            startSilenceDetection(stream);
            
        } catch (err) {
            addMessage("❌ Mic access denied!", "system");
        }
    }

    function stopRecording() {
        if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
        }
        
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            isRecording = false;
            
            document.getElementById("mic-btn").classList.remove("recording");
            document.getElementById("mic-btn").textContent = "🎤";
            statusDiv.textContent = "🟢 Connected — Ready to talk!";
            statusDiv.className = "status connected";
        }
        
        if (!autoMode && micStream) {
            micStream.getTracks().forEach(track => track.stop());
            micStream = null;
        }
    }

    function startSilenceDetection(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        let silentSince = null;
        const SILENCE_THRESHOLD = 15;
        const SILENCE_DURATION = 2500;
        
        function checkSilence() {
            if (!isRecording) return;
            
            analyser.getByteFrequencyData(dataArray);
            const avgLevel = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            
            if (avgLevel < SILENCE_THRESHOLD) {
                if (!silentSince) silentSince = Date.now();
                if (Date.now() - silentSince > SILENCE_DURATION) {
                    stopRecording();
                    return;
                }
            } else {
                silentSince = null;
            }
            
            silenceTimer = setTimeout(checkSilence, 100);
        }
        setTimeout(checkSilence, 400);
    }

    function playAudio(blob) {
        if (!ttsEnabled) {
            if (autoMode) {
                setTimeout(() => { if (autoMode && !isRecording) startRecording(); }, 100);
            }
            return;
        }
        
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        
        const audioUrl = URL.createObjectURL(blob);
        currentAudio = new Audio(audioUrl);
        currentAudio.play();
        
        currentAudio.onended = () => {
            URL.revokeObjectURL(audioUrl);
            currentAudio = null;
            if (autoMode) {
                setTimeout(() => { if (autoMode && !isRecording) startRecording(); }, 100);
            }
        };
    }

    function sendText() {
        const input = document.getElementById("text-input");
        const message = input.value.trim();
        if (!message) return;
        
        interruptCurrentResponse();
        addMessage(message, "user");
        
        if (chatWs && chatWs.readyState === WebSocket.OPEN) {
            chatWs.send(message);
            showTyping();
        } else {
            addMessage("⚠️ Connection lost! Refresh the page.", "system");
        }
        input.value = "";
    }

    document.getElementById("text-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendText();
    });

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = `message ${type}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addMessageStreaming(text, type) {
        const div = document.createElement("div");
        div.className = `message ${type}`;
        chatBox.appendChild(div);
        
        let i = 0;
        const speed = 15;
        function typeChar() {
            if (i < text.length) {
                div.textContent += text.charAt(i);
                i++;
                chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(typeChar, speed);
            }
        }
        typeChar();
    }

    function showTyping() {
        removeTyping();
        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.id = "typing-dots";
        indicator.innerHTML = "<span></span><span></span><span></span>";
        chatBox.appendChild(indicator);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
        const existing = document.getElementById("typing-dots");
        if (existing) existing.remove();
    }

    async function uploadPDF() {
        const input = document.getElementById("pdf-input");
        const file = input.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        const uploadBtn = document.getElementById("upload-btn");
        const progress = document.getElementById("kb-progress");
        const progressBar = document.getElementById("kb-progress-bar");
        const progressText = document.getElementById("kb-progress-text");

        uploadBtn.disabled = true;
        uploadBtn.textContent = "⏳ Uploading...";
        uploadBtn.style.borderColor = "#fbbf24";
        uploadBtn.style.color = "#fbbf24";
        progress.style.display = "block";
        progressBar.style.width = "20%";
        progressText.textContent = `📤 Uploading ${file.name}...`;

        setTimeout(() => { progressBar.style.width = "50%"; progressText.textContent = "📄 Processing PDF..."; }, 500);
        setTimeout(() => { progressBar.style.width = "75%"; progressText.textContent = "🔍 Building search index..."; }, 1500);

        try {
            const res = await fetch("/api/knowledge/upload", { method: "POST", body: formData });
            const data = await res.json();

            if (res.ok) {
                progressBar.style.width = "100%";
                progressBar.style.background = "linear-gradient(90deg, #4ade80, #22c55e)";
                progressText.textContent = `✅ ${data.message} (${data.total_chunks} chunks)`;
                addMessage(`✅ ${data.message} (${data.total_chunks} chunks)`, "system");
            } else {
                progressBar.style.background = "#ef4444";
                progressText.textContent = `❌ ${data.error}`;
                addMessage(`❌ ${data.error}`, "system");
            }
        } catch (e) {
            progressBar.style.background = "#ef4444";
            progressText.textContent = `❌ Upload failed`;
            addMessage(`❌ Upload failed: ${e.message}`, "system");
        }

        uploadBtn.disabled = false;
        uploadBtn.textContent = "📄 Upload PDF";
        uploadBtn.style.borderColor = "#3b82f6";
        uploadBtn.style.color = "#3b82f6";
        
        setTimeout(() => {
            progress.style.display = "none";
            progressBar.style.width = "0%";
            progressBar.style.background = "linear-gradient(90deg, #3b82f6, #8b5cf6)";
        }, 3000);

        input.value = "";
        loadKBStatus();
    }

    async function loadKBStatus() {
        try {
            const res = await fetch("/api/knowledge/status");
            const data = await res.json();

            const statusEl = document.getElementById("kb-status");
            const filesEl = document.getElementById("kb-files");

            if (data.files.length > 0) {
                statusEl.textContent = `${data.files.length} file(s) | ${data.total_chunks} chunks`;
                statusEl.style.color = "#4ade80";

                filesEl.innerHTML = data.files.map(f => `
                    <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 10px; margin-top:4px; background:#1a1a2e; border-radius:8px; font-size:12px;">
                        <span style="color:#aaa;">📄 ${f}</span>
                        <button onclick="deleteKBFile('${f}')" style="background:transparent; border:none; color:#f87171; cursor:pointer; font-size:11px;">🗑️</button>
                    </div>
                `).join("");
            } else {
                statusEl.textContent = "No documents";
                statusEl.style.color = "#666";
                filesEl.innerHTML = "";
            }
        } catch (e) {}
    }

    async function deleteKBFile(filename) {
        try {
            const res = await fetch(`/api/knowledge/${filename}`, { method: "DELETE" });
            const data = await res.json();
            addMessage(`🗑️ ${data.message}`, "system");
        } catch (e) {
            addMessage(`❌ Delete failed`, "system");
        }
        loadKBStatus();
    }

    fetch("/api/knowledge/clear", { method: "DELETE" })
        .then(() => loadKBStatus())
        .catch(() => loadKBStatus());
    </script>
</body>
</html>
